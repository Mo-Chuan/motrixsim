[project]
name = "motrixsim-docs"
version = "1.0.0"
description = "A high-performance physics simulation engine designed for multibody dynamics and robotics simulation."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrixsim==1.0.0",
    "onnxruntime>=1.23,<1.24",
    "numpy-quaternion>=2024.0.8",
    "imageio[ffmpeg]>=2.37.2",
    "matplotlib>=3.10.8",
    "mujoco>=4.0.0",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
gpu = [
    "motrixsim[gpu]"
]
usd = [
    "motrixsim[usd]"
]
docs = [
    "sphinx",
    "autodocsumm",
    "pydata-sphinx-theme",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-subfigure",
    "sphinxcontrib-video",
    "sphinx-togglebutton",
    "sphinx-design",
]

